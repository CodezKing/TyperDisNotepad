<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home page</title>
     <script src="https://cdn.tailwindcss.com"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
</head>
<body>
    <div draggable="" 
        id="wrapper"
        class="bg-white h-[500px] absolute p-6 rounded-lg shadow-md w-[800px] space-y-4 left-0 right-0 top-0 bottom-0 m-auto overflow-hidden">        
    
                <div id="header" class="flex justify-between cursor-move text-black p-6 bg-white border-2 rounded-t-2xl w-[800px] relative bottom-[30px] left-[-24px] m-auto">
                
                
                    <div id="actions" class="float-right absolute right-[30px] flex gap-3 cursor-pointer"
                        onmousedown="event.stopPropagation(); event.stopImmediatePropagation();  event.preventDefault();">

                            
                            <i class="fa fa-window-minimize" onclick="toggleMinimize()" ></i>
                            <i class="fa fa-window-maximize" onclick="toggleMaximize()"></i>
                            <i class="fa fa-window-close" onclick="closeWindow()"> </i>
                    </div>
                </div>
                
                
            <div id="divider" class="grid grid-cols-3 ">
                <div id="sidebar" class="left-[0px] top-[44px] absolute bg-neutral-300 p-4 w-[150px] col-span-1 h-full">
                
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2 hover:bg-white hover:text-black-700 transition-colors">Home</button><br>
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2 hover:bg-white hover:text-black-700 transition-colors">New</button><br>
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2">Open</button><br>
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2">Settings</button><br>
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2">Print</button><br>
                    <button class="text-white bg-neutral-800 w-[100px] m-3 rounded px-4 py-2">Feedback</button><br>
                </div>

                <div id="main"  class="col-span-2 bg-neutral-800 absolute left-[150px] top-[44px] w-[649px] h-[calc(100%-88px)] text-neutral-300 overflow-y-auto pr-2 h-full">
                    <div class="p-6 space-y-4 my-[70px]">
                        <h1 class="text-2xl">Good morning "user"</h1>
                        <p class="text-l">You have: Credits</p>
                        <a href="../Document/index.html"><button class="text-l w-[200px] bg-neutral-300 text-black p-1 hover:bg-white hover:text-black-700 transition-colors">Type a new document</button></a>
                        <p class="text-l">Recent work:</p>

                        <div class="bg-neutral-300 w-[500px] space-y-2">
                            <a href="" class="block bg-neutral-300 text-black p-2 hover:bg-gray-200"><p>The frozen pancake</p></a>
                            <a href="" class="block bg-neutral-300 text-black p-2 hover:bg-gray-200"><p>Knight's shield</p></a>
                            <a href="" class="block bg-neutral-300 text-black p-2 hover:bg-gray-200"><p>Panda fist</p></a>
                        </div>
                        <p class="text-l">Task assigned to you: </p>
                        <div class="w-[500px] h-[50px] bg-neutral-300"></div>
                        <p>See your performance: </p>
                        <p>Customer Review: </p>
                        <p class="text-l mt-8">Additional content:</p>
                        
                    </div>
                </div>
            </div>

        <script src="script.js"></script>
    </body>
    <p>Buttons by Phoenix Group</p>
</html>
